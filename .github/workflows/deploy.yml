name: Dynamic Folder and File Sync

on:
  push:
    branches:
      - main

# Pagesの直接公開（パブリッシュ）に必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行された場合に古いジョブをキャンセルする設定
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync modified folders or files from hidden JSON
        run: |
          # .github/sync-config.json から設定を読み込んでファイルをコピー
          jq -c '.[]' .github/sync-config.json | while read -r set; do
            SRC=$(echo "$set" | jq -r '.from')
            DEST=$(echo "$set" | jq -r '.to')
            
            # 過去すべてのファイル（フルビルド）を対象とするため、存在チェックのみで安全にコピー
            if [ -e "${SRC}" ]; then
              echo "Syncing ${SRC} to ${DEST}..."
              mkdir -p "./${DEST}"
              if [ -f "${SRC}" ]; then
                cp "${SRC}" "./${DEST}/"
              elif [ -d "${SRC}" ]; then
                cp -r ${SRC}/* "./${DEST}/"
              fi
            fi
          done

      # -------------------------------------------------------------
      # ここから下で、リポジトリにコミットせず直接WEB公開へ流し込みます
      # -------------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # WEB公開したいフォルダを指定（docsフォルダを公開する場合）
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
