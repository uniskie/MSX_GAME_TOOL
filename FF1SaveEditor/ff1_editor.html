<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＦＣ版／ＭＳＸ版 ファイナルファンタジーⅠ セーブデータ エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000000;
    --ff-blue: #002890;       /* Nestopia実機画面の鮮やかなロイヤルブルー（ウィンドウ背景） */
    --ff-dark-blue: #001440;  /* ダークブルー（非アクティブタブ等） */
    --ff-focus-blue: #1c62e8; /* フォーカス・アクティブ時のライトブルー */
    --ff-border-white: #ffffff;
    --ff-border-gray: #808080;
    --text-color: #ffffff;
    --accent-yellow: #ffff00;
    --badge-green: #008800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'DotGothic16', monospace, "MS Gothic", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    color: #fff;
    margin: 0 0 14px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  
  .container { width: 100%; max-width: 1600px; margin: 0 auto; }

  #dropOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 40, 144, 0.85);
    border: 4px dashed #ffffff;
    z-index: 9999;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    pointer-events: none;
  }
  body.dragover #dropOverlay { display: flex; }

  .card, .content-panel, .io-panel {
    background-color: var(--ff-blue) !important;
    border: 3px solid var(--ff-border-white) !important;
    border-radius: 8px !important;
    box-shadow: inset 0 0 0 2px var(--ff-border-gray) !important;
    padding: 14px;
    margin-bottom: 12px;
  }

  .io-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .file-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .file-btn-wrapper { position: relative; display: inline-block; }
  .file-btn {
    background: var(--ff-dark-blue);
    border: 2px solid var(--ff-border-white);
    color: #fff;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .file-btn:hover { background: #002470; }
  input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  
  .save-btn {
    background: #008800;
    border: 2px solid var(--ff-border-white);
    color: white;
    padding: 8px 24px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .save-btn:hover { background: #00aa00; }
  .save-btn:disabled { background: #444; color: #888; border-color: #666; cursor: not-allowed; }
  
  .status-bar {
    background: var(--ff-dark-blue);
    border: 2px solid var(--ff-border-white);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .status-line { display: flex; align-items: center; gap: 10px; }

  .tabs { display: flex; gap: 4px; margin-bottom: -1px; }
  .tab-btn {
    background: var(--ff-dark-blue);
    border: 2px solid var(--ff-border-gray);
    border-bottom: none;
    color: #a0c0ff;
    padding: 8px 18px;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.1s, color 0.1s;
  }
  .tab-btn:hover:not(.active) {
    background: #001e60;
    color: #ffffff;
  }
  .tab-btn.active {
    background: var(--ff-blue) !important;
    color: #ffffff;
    border-color: var(--ff-border-white) !important;
    border-bottom: 2px solid var(--ff-blue) !important;
  }

  .content-panel {
    border-radius: 0 8px 8px 8px !important;
    display: none;
  }
  .content-panel.active { display: block; }

  .auto-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(365px, 1fr));
    gap: 14px;
    align-items: start;
  }
  
  .card-title {
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--ff-border-white);
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .field { display: flex; align-items: center; margin-bottom: 6px; }
  .field label { width: 110px; color: #ffffff; font-size: 14px; font-weight: bold; flex-shrink: 0; }
  .card-basic .field label { width: 68px; }
  input[type="number"], input[type="text"], select {
    background: var(--ff-blue);
    border: 2px solid var(--ff-border-white);
    border-radius: 4px;
    color: #ffffff;
    padding: 3px 6px;
    font-size: 14px;
    font-family: inherit;
    font-weight: bold;
    box-sizing: border-box;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .w-name   { width: 72px; }
  /*.w-2digit { width: 50px; text-align: center; }*/
  .w-2digit { width: 64px; text-align: center; } /*1byteなので制限なしでは3桁*/
  .w-3digit { width: 64px; text-align: center; }
  .w-4digit { width: 80px; text-align: center; }
  .w-6digit { width: 94px; text-align: center; }
  .w-select { width: 145px; }
  .w-equip  { width: 135px; }

  input[type="number"]::-webkit-inner-spin-button {
    margin-left: 5px;
    cursor: pointer;
  }

  select, select option {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    background: var(--ff-blue);
    color: #ffffff;
  }
  select option:disabled {
    color: #888888;
  }
  select option[hidden] {
    display: none;
  }
  input[type="number"]:focus, input[type="text"]:focus, select:focus {
    outline: none;
    background: var(--ff-focus-blue);
    border-color: var(--accent-yellow);
  }
  #paramSourceSelect, #paramSourceSelect option {
    font-size: 12px;
    background: #000000;
  }
  #paramSourceSelect:focus {
    background: #000000;
  }
  .field-check { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; cursor: pointer; font-size: 14px; font-weight: bold; color:#fff; }
  .field-check input { cursor: pointer; width: 15px; height: 15px; }

  /* 装備スロット用レイアウト */
  .equip-row {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: nowrap;
  }
  .equip-row label {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 13px;
    font-weight: bold;
    color: #ffffff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .equip-row label.disabled {
    color: #888888;
    cursor: not-allowed;
  }
  .equip-stat {
    font-size: 14px;
    color: #ffea70;
    white-space: nowrap;
    font-weight: bold;
    background: transparent;
    padding: 0;
    border: none;
    display: inline-block;
  }
  .equip-stat.incompatible {
    color: #ff7777;
  }

  .magic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .magic-lv-card { background: var(--ff-blue); border: 1px solid var(--ff-border-white); padding: 8px; border-radius: 4px; }
  .magic-lv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color:#fff; }
  .magic-mp-inputs { display: flex; align-items: center; gap: 3px; font-weight: bold; color: #ffffff; }
  .magic-mp-inputs input {
    width: 32px;
    padding: 2px 0;
    text-align: center;
    -moz-appearance: textfield;
  }
  .magic-mp-inputs input::-webkit-outer-spin-button,
  .magic-mp-inputs input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  #consumablesContainer {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 12px;
  }
  #consumablesContainer .field label {
    width: 88px;
  }

  #keyItemsContainer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 4px 10px;
  }

  .char-preview-box { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .char-canvas {
    box-sizing: content-box;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: transparent;
    width: 48px;
    height: 72px;
    flex-shrink: 0;
  }
  .badge {
    background: transparent;
    border: none;
    color: #ffffff;
    padding: 0;
    font-size: 14px;
    font-weight: bold;
  }
  .tag-diff { background: #b05000; border: 1px solid #ffcc00; color: #ffffaa; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>

<div id="dropOverlay">ここにファイルをドロップ (.SAV または .NES)</div>

<div class="container">
  <h1>
    <span>ＦＣ版／ＭＳＸ版 ファイナルファンタジーⅠ セーブデータエディタ</span>
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:16px;">
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span>パラメータ基準:</span>
        <select id="paramSourceSelect" style="width:auto; padding:1px 6px;" onchange="onParamSourceChange()">
          <option value="standard">デフォルト (標準)</option>
          <option value="rom" id="optRomSource" disabled>読み込みROM準拠 (未読込)</option>
        </select>
      </div>
      <label style="font-size:12px; font-weight:normal; display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="restrictEquipCheckbox" checked onchange="onRestrictEquipToggle()"> 装備制限
      </label>
      <label style="font-size:12px; font-weight:normal; display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="autoCalcCheckbox" checked> パラメータ自動計算
      </label>
      <label style="font-size:12px; font-weight:normal; display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="paramLimitCheckbox" checked onchange="onParamLimitToggle()"> パラメータ制限
      </label>
    </div>
  </h1>

  <!-- 入出力パネル -->
  <div class="io-panel">
    <div class="io-controls">
      <div class="file-inputs">
        <div class="file-btn-wrapper">
          <span class="file-btn">📂 SAV / DSK 読込</span>
          <input type="file" id="savInput" accept=".sav,.bin,.dsk">
        </div>
        <div class="file-btn-wrapper">
          <span class="file-btn" style="border-style:dashed;">🎮 NES ROM 読込 (任意・テーブル抽出)</span>
          <input type="file" id="nesInput" accept=".nes">
        </div>
      </div>
      <button class="save-btn" id="exportBtn" disabled>💾 SAVを保存</button>
    </div>
    <div class="status-bar">
      <div class="status-line">
        <span id="fileStatus" style="color:#ffffff;">【SAV】ファイルを画面にドロップ または 選択してください</span>
      </div>
      <div class="status-line">
        <span id="romStatus" style="color:#a0c0ff;">【ROM】未読込 (デフォルトの標準テーブルを使用中)</span>
      </div>
    </div>
  </div>

  <!-- タブナビゲーション -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('partyTab', event)">パーティ共通</button>
    <button class="tab-btn" onclick="switchTab('char0Tab', event)">キャラ 1</button>
    <button class="tab-btn" onclick="switchTab('char1Tab', event)">キャラ 2</button>
    <button class="tab-btn" onclick="switchTab('char2Tab', event)">キャラ 3</button>
    <button class="tab-btn" onclick="switchTab('char3Tab', event)">キャラ 4</button>
  </div>

  <!-- 共通タブ -->
  <div id="partyTab" class="content-panel active">
    <div class="auto-grid">
      <!-- 基本・乗り物 -->
      <div class="card">
        <div class="card-title">基本・乗り物フラグ</div>
        <div class="field">
          <label style="width: 100px; white-space: nowrap;">所持金（ギル）</label>
          <input type="number" id="goldInput" class="w-6digit" min="0" max="999999">
        </div>
        <div style="margin-top:12px;">
          <label class="field-check"><input type="checkbox" id="bridgeFlag"> 北の橋 架橋済み</label>
          <label class="field-check"><input type="checkbox" id="introSceneFlag"> OPデモ 表示済み</label>
          <label class="field-check"><input type="checkbox" id="shipFlag"> 船 所持</label>
          <label class="field-check"><input type="checkbox" id="nitroFlag"> 海峡 爆破済み </label>
          <label class="field-check"><input type="checkbox" id="airshipFlag"> 飛空艇 所持</label>
        </div>
      </div>

      <!-- 消費アイテム -->
      <div class="card">
        <div class="card-title">消費アイテム (各 0〜99)</div>
        <div id="consumablesContainer"></div>
      </div>

      <!-- 重要イベントアイテム -->
      <div class="card">
        <div class="card-title">重要アイテム (フラグ)</div>
        <div id="keyItemsContainer"></div>
      </div>
    </div>
  </div>

  <!-- 各キャラタブ -->
  <div id="charTabContainer"></div>

</div>

    PLATFORM_WEAPONS.fc.push({ id: i, name: `[未定義 $${i.toString(16).toUpperCase()}]`, category: "unknown", atk: (i * 3) & 0xFF, hit: (i * 7) & 0xFF, def: 0, wt: 0, type: "none", jobs: [] });

let activePlatform = 'fc';
let activeWeaponTable = PLATFORM_WEAPONS.fc;
let activeArmorTable = PLATFORM_ARMORS.fc;

function setPlatform(platform) {
  if (platform !== 'fc' && platform !== 'msx') return;
  activePlatform = platform;
  activeWeaponTable = PLATFORM_WEAPONS[platform];
  activeArmorTable = PLATFORM_ARMORS[platform];
  rebuildAllEquipSelectOptions();
}

function rebuildCharEquipOptions(c) {
  const isRestricted = document.getElementById('restrictEquipCheckbox').checked;

  // 武器スロットの選択肢構築
  for (let w = 0; w < 4; w++) {
    const sel = document.getElementById(`c${c}_wep_${w}`);
    if (!sel) continue;
    const curVal = parseInt(sel.value) || 0;
    const list = isRestricted
      ? activeWeaponTable.filter(i => i.id === 0 || i.category === 'weapon')
      : activeWeaponTable;
    sel.innerHTML = list.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
    sel.value = curVal;
  }

  // 防具スロットの選択肢構築
  for (let a = 0; a < 4; a++) {
    const sel = document.getElementById(`c${c}_arm_${a}`);
    if (!sel) continue;
    const curVal = parseInt(sel.value) || 0;
    const list = isRestricted
      ? activeArmorTable.filter(i => i.id === 0 || i.category === 'armor')
      : activeArmorTable;
    sel.innerHTML = list.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
    sel.value = curVal;
  }
}

function rebuildAllEquipSelectOptions() {
  for (let c = 0; c < 4; c++) {
    rebuildCharEquipOptions(c);
    updateAllEquipStatsAndRestrictions(c);
  }
}

}

function sanitizeNameInput(input) {
  let val = input.value.replace(/　/g, " ");
  let filtered = "";
  for (const ch of val) {
    if (REVERSE_CHAR_MAP[ch] !== undefined) {
      filtered += ch;
    }
  }
  if (filtered.length > 4) filtered = filtered.slice(0, 4);
  if (input.value !== filtered) {
    input.value = filtered;
  }
}

function isLimitUnlocked() {
  const chk = document.getElementById('paramLimitCheckbox');
  // チェックONで制限あり（通常）、チェックOFFで制限解除（物理限界）
  return chk ? !chk.checked : false;
}

function getLimit(type) {
  const lim = PARAM_LIMITS[type];
  if (!lim) return 255;
  return isLimitUnlocked() ? lim.byte : lim.game;
}

function onParamLimitToggle() {
  updateAllInputLimits();
}

function clampNumberInput(input) {
  if (input.value === "") return;
  let val = parseInt(input.value, 10);
  if (isNaN(val)) return;
  const min = input.hasAttribute('min') ? parseInt(input.min, 10) : null;
  const max = input.hasAttribute('max') ? parseInt(input.max, 10) : null;
  if (min !== null && val < min) val = min;
  if (max !== null && val > max) val = max;
  input.value = val;
}

function updateAllInputLimits() {
  const unlocked = isLimitUnlocked();
  document.getElementById('goldInput').max = unlocked ? PARAM_LIMITS.gold.byte : PARAM_LIMITS.gold.game;

  CONSUMABLES.forEach(c => {
    const el = document.getElementById(`con_${c.id}`);
    if (el) el.max = unlocked ? PARAM_LIMITS.item.byte : PARAM_LIMITS.item.game;

  for (let c = 0; c < 4; c++) {
    const setMax = (id, type) => {
      const el = document.getElementById(id);

/**
 * 汎用バイト読み書き関数
 */
function readVal(buf, offset, bytes, endian = 'LE') {
  let val = 0;
  if (endian === 'LE') {
    for (let i = 0; i < bytes; i++) {
      val |= (buf[offset + i] << (i * 8));
    }
  } else {
    for (let i = 0; i < bytes; i++) {
      val = (val << 8) | buf[offset + i];
    }
  }
  return val >>> 0;
}

function writeVal(buf, offset, bytes, val, endian = 'LE') {
  val = Math.max(0, val);
  if (endian === 'LE') {
    for (let i = 0; i < bytes; i++) {
      buf[offset + i] = (val >> (i * 8)) & 0xFF;
    }
  } else {
    for (let i = bytes - 1; i >= 0; i--) {
      buf[offset + i] = val & 0xFF;
      val = Math.floor(val / 256);
    }
  }
}

    new Uint8Array([0x00,0x03,0x07,0x07,0x0F,0xF8,0x05,0x17, 0x00,0x00,0x00,0x00,0x00,0x00,0x05,0x07, 0x00,0xC0,0x81,0x6E,0xF8,0x80,0x80,0x00, 0x00,0x1C,0x70,0x80,0x00,0xE0,0xF0,0x7C, 0x36,0x79,0x99,0x6B,0xF0,0xE7,0xC3,0xC3, 0x06,0x00,0x04,0x20,0x10,0x00,0xC0,0xC0, 0xAA,0xA9,0xB5,0xE0,0x1F,0x9F,0xFF,0xF7, 0x54,0x56,0x4A,0x05,0x08,0x00,0x30,0x30, 0x41,0x41,0x40,0x40,0x40,0x40,0x71,0x03, 0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00, 0xE7,0xE7,0x07,0xE7,0xF7,0xE7,0xE7,0xE6, 0x00,0x00,0xE0,0x10,0x00,0x00,0x00,0x00]),
    // 10: 白魔道士 (White Wizard) - 96 bytes
    new Uint8Array([0x00,0x0F,0x1F,0x2F,0x2F,0x11,0x0B,0x0E, 0x00,0x00,0x00,0x08,0x0C,0x00,0x0B,0x0E, 0x00,0xC0,0xE0,0xE0,0xF0,0xF0,0xF8,0xD4, 0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x28, 0x0C,0x10,0x10,0x10,0x00,0x00,0xC4,0xC3, 0x2C,0x40,0x21,0xCF,0xEE,0x33,0xD3,0xD4, 0xD0,0x50,0x50,0x40,0x40,0x40,0x00,0xF0, 0x26,0x8F,0xAB,0x37,0xB3,0xAD,0xCF,0x37, 0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00, 0x37,0xB7,0xB7,0x6D,0x0E,0x0B,0x0C,0x1F, 0xF0,0xC0,0xA0,0xA0,0x00,0x00,0x00,0x00, 0x37,0x07,0x56,0x4C,0x30,0xF8,0x98,0xFC]),
    // 11: 黒魔道士 (Black Wizard) - 96 bytes
    new Uint8Array([0x00,0x00,0x00,0x00,0x01,0x07,0x00,0x05, 0x1F,0x07,0x3F,0x0F,0x06,0x00,0x00,0x00, 0x00,0x04,0x02,0x12,0xA2,0x56,0xEE,0xDC, 0xC0,0xF4,0xFA,0xEA,0x5A,0x26,0x0E,0x1C, 0x17,0x06,0x0F,0x80,0x6F,0xEF,0xEF,0xEF, 0x10,0xF0,0x7F,0x90,0x6F,0xEF,0x2F,0x2F, 0x7C,0xE0,0x85,0x4B,0xC7,0xBF,0x77,0x77, 0x7C,0xFF,0xBD,0x7B,0xC7,0xBF,0x07,0x07, 0x2F,0xAF,0xAF,0xAF,0xAF,0xAF,0xAF,0x5F, 0x2F,0xAF,0xAF,0xAF,0xAF,0xAF,0xAF,0x5F, 0x37,0x4F,0x4E,0x4E,0x4E,0x4C,0x4A,0xB7, 0x07,0x4F,0x4E,0x4E,0x4E,0x4C,0x4A,0xB7])
  ];

  static romData = {
    loaded: false,
    diffDetected: false,
    diffList: [],
    expTable: null,
    initialStats: null,
    growth: null,
    weapons: null,
    armors: null,
    battlePalettes: null,
    jobPaletteAssignment: null
  };

  static currentSource = 'standard';

  static get activeExpTable() {
    return (this.currentSource === 'rom' && this.romData.expTable) ? this.romData.expTable : this.standard.expTable;
  }
  static get activeInitialStats() {
    return (this.currentSource === 'rom' && this.romData.initialStats) ? this.romData.initialStats : this.standard.initialStats;
  }
  static get activeGrowth() {
    return (this.currentSource === 'rom' && this.romData.growth) ? this.romData.growth : this.standard.growth;
  }
  static get activePalettes() {
    return (this.romData.battlePalettes) ? this.romData.battlePalettes : this.standard.battlePalettes;
  }
  static get activeJobPaletteAssignment() {
    return (this.romData.jobPaletteAssignment) ? this.romData.jobPaletteAssignment : this.standard.jobPaletteAssignment;
  }

  static getPrgStartOffset(rom) {
    if (!rom || rom.length < 16) return 16;
    const hasTrainer = (rom[6] & 0x04) !== 0;
    return 16 + (hasTrainer ? 512 : 0);
  }

  static getBankOffset(rom, bankIndex) {
    return this.getPrgStartOffset(rom) + (bankIndex * 0x4000);
  }

  static applyDummyRom() {
    // 256KB PRG-ROM + 16バイト iNESヘッダー (合計262,160バイト)
    const dummyRom = new Uint8Array(262160);
    dummyRom[0] = 0x4E; dummyRom[1] = 0x45; dummyRom[2] = 0x53; dummyRom[3] = 0x1A; // "NES\x1A"
    dummyRom[4] = 16; // PRG-ROM 16KB * 16 = 256KB
    const bank9Offset = 16 + (9 * 0x4000);
    for (let job = 0; job < 12; job++) {
      const offset = bank9Offset + 0x1000 + (job * 0x200);
      dummyRom.set(this.DEFAULT_SPRITES[job], offset);
    }
    nesRom = dummyRom;
  }

  static updateRuntimeTables() {
    if (activePlatform !== 'fc') return;
    const isRom = (this.currentSource === 'rom');
    for (let i = 0; i < 40; i++) {
      const wep = PLATFORM_WEAPONS.fc[i + 1];
      if (wep) {
        if (isRom && this.romData.weapons && this.romData.weapons[i]) {
          wep.atk = this.romData.weapons[i].atk;
          wep.hit = this.romData.weapons[i].hit;
        } else {
          wep.atk = BASE_WEAPONS_DATA[i].atk;
          wep.hit = BASE_WEAPONS_DATA[i].hit;
        }
      }
      const arm = PLATFORM_ARMORS.fc[i + 1];
      if (arm) {
        if (isRom && this.romData.armors && this.romData.armors[i]) {
          arm.def = this.romData.armors[i].def;
          arm.wt = this.romData.armors[i].wt;
        } else {
          arm.def = BASE_ARMORS_DATA[i].def;
          arm.wt = BASE_ARMORS_DATA[i].wt;
        }
      }
    }
    for (let c = 0; c < 4; c++) {
      updateAllEquipStatsAndRestrictions(c);
      recalculateParameters(c);
    }
  }

  static setSource(source) {
    this.currentSource = source;
    const sel = document.getElementById('paramSourceSelect');
    if (sel.value !== source) sel.value = source;

    this.updateRuntimeTables();

    if (document.getElementById('autoCalcCheckbox').checked) {
      for (let c = 0; c < 4; c++) {
        simulateLevelStats(c);
      }
    }
  }

  static extractFromROM(rom) {
    this.romData.loaded = true;
    this.romData.diffList = [];
    this.romData.diffDetected = false;

    const prgStart = this.getPrgStartOffset(rom);
    const fixedBankOffset = this.getBankOffset(rom, 15);
    const bankCOffset = this.getBankOffset(rom, 12);

    // --- 武器データ抽出 (Bank C: 40武器、各4バイト [Hit%, Atk, Crit%, Elem/Status]) ---
    let wepOffset = -1;
    if (bankCOffset + 0x4000 <= rom.length) {
      for (let i = 0; i < 0x4000 - 160; i++) {
        const o = bankCOffset + i;
        if (rom[o] === 0 && rom[o+1] === 12 && rom[o+4] === 10 && rom[o+5] === 5 && rom[o+8] === 0 && rom[o+9] === 6) {
          wepOffset = o;
          break;
        }
      }
    }
    if (wepOffset < 0) {
      for (let o = prgStart; o < rom.length - 160; o++) {
        if (rom[o] === 0 && rom[o+1] === 12 && rom[o+4] === 10 && rom[o+5] === 5 && rom[o+8] === 0 && rom[o+9] === 6) {
          wepOffset = o;
          break;
        }
      }
    }
    if (wepOffset >= 0) {
      this.romData.weapons = [];
      let wepDiff = false;
      for (let i = 0; i < 40; i++) {
        const o = wepOffset + (i * 4);
        const hit = rom[o];
        const atk = rom[o+1];
        const base = BASE_WEAPONS_DATA[i];
        this.romData.weapons.push({ atk, hit });
        if (atk !== base.atk || hit !== base.hit) wepDiff = true;
      }
      if (wepDiff) this.romData.diffList.push("武器性能");
    }

    // --- 防具データ抽出 (Bank C: 40防具、各4バイト [Def, Wt, Resist, Special]) ---
    let armOffset = -1;
    if (bankCOffset + 0x4000 <= rom.length) {
      for (let i = 0; i < 0x4000 - 160; i++) {
        const o = bankCOffset + i;
        if (rom[o] === 1 && rom[o+1] === 2 && rom[o+4] === 4 && rom[o+5] === 8 && rom[o+8] === 15 && rom[o+9] === 15) {
          armOffset = o;
          break;
        }
      }
    }
    if (armOffset < 0) {
      for (let o = prgStart; o < rom.length - 160; o++) {
        if (rom[o] === 1 && rom[o+1] === 2 && rom[o+4] === 4 && rom[o+5] === 8 && rom[o+8] === 15 && rom[o+9] === 15) {
          armOffset = o;
          break;
        }
      }
    }
    if (armOffset >= 0) {
      this.romData.armors = [];
      let armDiff = false;
      for (let i = 0; i < 40; i++) {
        const o = armOffset + (i * 4);
        const def = rom[o];
        const wt = rom[o+1];
        const base = BASE_ARMORS_DATA[i];
        this.romData.armors.push({ def, wt });
        if (def !== base.def || wt !== base.wt) armDiff = true;
      }
      if (armDiff) this.romData.diffList.push("防具性能");
    }

    let palTableOffset = -1;
    if (fixedBankOffset >= 0) {
      const standardPalOffset = fixedBankOffset + 0x2C34;
      if (standardPalOffset + 16 <= rom.length) {
        let valid = true;
        for (let k = 0; k < 16; k++) {
          if (rom[standardPalOffset + k] > 0x3F) { valid = false; break; }
        }
        if (valid) palTableOffset = standardPalOffset;
      }
    }
    if (palTableOffset < 0) {
      for (let i = 0; i < rom.length - 16; i++) {
        if (rom[i] === 0x0F && rom[i+1] === 0x28 && rom[i+2] === 0x18 && rom[i+3] === 0x21 &&
            rom[i+4] === 0x0F && rom[i+5] === 0x16 && rom[i+6] === 0x30 && rom[i+7] === 0x36) {
          palTableOffset = i;
          break;
        }
      }
    }

    if (palTableOffset >= 0 && palTableOffset + 16 <= rom.length) {
      this.romData.battlePalettes = {};
      let palDiff = false;
      for (let p = 0; p < 4; p++) {
        const pal = [
          rom[palTableOffset + p * 4 + 0],
          rom[palTableOffset + p * 4 + 1],
          rom[palTableOffset + p * 4 + 2],
          rom[palTableOffset + p * 4 + 3]
        ];
        this.romData.battlePalettes[p] = pal;
        const stdPal = this.standard.battlePalettes[p];
        if (pal.some((col, idx) => col !== stdPal[idx])) palDiff = true;
      }
      if (palDiff) this.romData.diffList.push("戦闘パレット");
    }

    let jobPalOffset = -1;
    for (let j = 0; j < rom.length - 7; j++) {
      if (rom[j] === 0xBD && rom[j+1] === 0x00 && rom[j+2] === 0x61 && rom[j+3] === 0xA8 && rom[j+4] === 0xB9) {
        const refAddr = rom[j+5] | (rom[j+6] << 8);
        if (refAddr >= 0xC000 && refAddr <= 0xFFFF && fixedBankOffset >= 0) {
          jobPalOffset = fixedBankOffset + (refAddr - 0xC000);
          break;
        }
      }
    }
    if (jobPalOffset >= 0 && jobPalOffset + 12 <= rom.length) {
      let valid = true;
      for (let k = 0; k < 12; k++) {
        if (rom[jobPalOffset + k] > 3) { valid = false; break; }
      }
      if (valid) {
        const assign = [];
        let assignDiff = false;
        for (let k = 0; k < 12; k++) {
          const val = rom[jobPalOffset + k];
          assign.push(val);
          if (val !== this.standard.jobPaletteAssignment[k]) assignDiff = true;
        }
        this.romData.jobPaletteAssignment = assign;
        if (assignDiff) this.romData.diffList.push("ジョブパレット割当");
      }
    }

    let startStatsOffset = -1;
    for (let i = 0; i < rom.length - 96; i++) {
      if (rom[i] === 0x00 && rom[i+16] === 0x01 && rom[i+32] === 0x02 &&
          rom[i+48] === 0x03 && rom[i+64] === 0x04 && rom[i+80] === 0x05) {
        if (rom[i+1] >= 20 && rom[i+1] <= 100 && rom[i+2] >= 10 && rom[i+2] <= 50) {
          startStatsOffset = i;
          break;
        }
      }
    }

    if (startStatsOffset >= 0) {
      this.romData.initialStats = [];
      let statsDiff = false;
      for (let job = 0; job < 6; job++) {
        const offset = startStatsOffset + (job * 16);
        const st = [
          rom[offset + 0x01],
          rom[offset + 0x02],
          rom[offset + 0x03],
          rom[offset + 0x04],
          rom[offset + 0x05],
          rom[offset + 0x06]
        ];
        this.romData.initialStats.push(st);
        const std = this.standard.initialStats[job];
        if (st.some((val, idx) => val !== std[idx])) statsDiff = true;
      }
      if (statsDiff) this.romData.diffList.push("初期能力値");
    }

    let expTableOffset = -1;
    for (let i = 0; i < rom.length - 150; i++) {
      if (rom[i] === 0x00 && rom[i+1] === 0x00 && rom[i+2] === 0x00 &&
          rom[i+3] === 0x28 && rom[i+4] === 0x00 && rom[i+5] === 0x00 &&
          rom[i+6] === 0xC4 && rom[i+7] === 0x00 && rom[i+8] === 0x00) {
        expTableOffset = i;
        break;
      }
    }
    if (expTableOffset < 0) {
      for (let i = 0; i < rom.length - 150; i++) {
        if (rom[i] === 0x00 && rom[i+1] === 0x00 && rom[i+2] === 0x00) {
          let strictlyIncreasing = true;
          let prev = 0;
          for (let lv = 1; lv < 50; lv++) {
            const o = i + (lv * 3);
            const val = rom[o] | (rom[o+1] << 8) | (rom[o+2] << 16);
            if (val <= prev || val > 1500000) { strictlyIncreasing = false; break; }
            prev = val;
          }
          if (strictlyIncreasing) {
            expTableOffset = i;
            break;
          }
        }
      }
    }

    if (expTableOffset >= 0) {
      this.romData.expTable = [];
      let expDiff = false;
      for (let lv = 0; lv < 50; lv++) {
        const o = expTableOffset + (lv * 3);
        const val = rom[o] | (rom[o+1] << 8) | (rom[o+2] << 16);
        this.romData.expTable.push(val);
        if (val !== this.standard.expTable[lv]) expDiff = true;
      }
      if (expDiff) this.romData.diffList.push("必要EXPテーブル");
    }

    this.romData.diffDetected = (this.romData.diffList.length > 0);

    const optRom = document.getElementById('optRomSource');
    optRom.disabled = false;
    optRom.innerText = `読み込みROM準拠 ${this.romData.diffDetected ? '(差分あり)' : '(標準と一致)'}`;

    if (this.romData.diffDetected) {
      this.setSource('rom');
    }
  }
}

function initUI() {
  const conContainer = document.getElementById('consumablesContainer');
  CONSUMABLES.forEach(item => {
    conContainer.innerHTML += `
      <div class="field">
        <label>${item.name}</label>
        <input type="number" id="con_${item.id}" class="w-2digit" min="0" max="99">
      </div>`;
  });

  const keyContainer = document.getElementById('keyItemsContainer');
  KEY_ITEMS.forEach(item => {
    keyContainer.innerHTML += `
      <label class="field-check">
        <input type="checkbox" id="key_${item.id}"> ${item.name}
      </label>`;
  });

  const charTabsRoot = document.getElementById('charTabContainer');
  for (let c = 0; c < 4; c++) {
    charTabsRoot.innerHTML += createCharTabHTML(c);
  }

  for (let c = 0; c < 4; c++) {
    renderCharSprite(c);
    updateAllEquipStatsAndRestrictions(c);
  }

  document.getElementById('autoCalcCheckbox').addEventListener('change', (e) => {
    if (e.target.checked) {
      for (let c = 0; c < 4; c++) {

      }
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target && e.target.type === 'number') {
      clampNumberInput(e.target);
    }
  });
}

function switchTab(tabId, ev) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
  
  if (ev && ev.currentTarget) {
    ev.currentTarget.classList.add('active');
  }
  document.getElementById(tabId).classList.add('active');
}

/**
 * 装備ステータス表示の更新 & 装備制限（職業可否・部位重複）の適用
 */
function updateAllEquipStatsAndRestrictions(c) {
  const isRestricted = document.getElementById('restrictEquipCheckbox').checked;
  const job = parseInt(document.getElementById(`c${c}_job`).value) || 0;

  // 1. 武器スロットの処理
  let wepEquippedSlot = -1;
  for (let w = 0; w < 4; w++) {
    const selEl = document.getElementById(`c${c}_wep_${w}`);
    const itemId = parseInt(selEl.value) || 0;
    const item = activeWeaponTable[itemId] || activeWeaponTable[0];
    const chk = document.getElementById(`c${c}_wepEquip_${w}`);
    const lbl = document.getElementById(`c${c}_wepEquipLabel_${w}`);
    const statEl = document.getElementById(`c${c}_wepStat_${w}`);

    // ジョブ適性の判定（制限チェックのON/OFFに関わらず純粋な仕様として判定）
    const isJobCompatible = (itemId === 0) || (item.category === 'weapon' && item.jobs && item.jobs.includes(job));

    if (itemId === 0) {
      statEl.textContent = "-";
      statEl.className = "equip-stat";
    } else {
      statEl.textContent = `攻 ${item.atk} / 命 ${item.hit}`;
      if (!isJobCompatible) {
        statEl.textContent += " 🆖";
        statEl.className = "equip-stat incompatible";
      } else {
        statEl.className = "equip-stat";
      }
    }

    if (isRestricted) {
      if (!isJobCompatible) {
        chk.checked = false;
        chk.disabled = true;
        lbl.classList.add('disabled');
      } else {
        chk.disabled = (itemId === 0);
        if (chk.disabled) lbl.classList.add('disabled');
        else lbl.classList.remove('disabled');

        if (chk.checked) {
          if (wepEquippedSlot === -1) {
            wepEquippedSlot = w;
          } else {
            chk.checked = false;
          }
        }
      }
    } else {
      // 制限OFF時: 🆖であっても強制装備を許可
      chk.disabled = (itemId === 0);
      if (itemId === 0) chk.checked = false;
      if (chk.disabled) lbl.classList.add('disabled');
      else lbl.classList.remove('disabled');
    }
  }

  // 2. 防具スロットの処理
  const equippedArmorTypes = new Set();
  for (let a = 0; a < 4; a++) {
    const selEl = document.getElementById(`c${c}_arm_${a}`);
    const itemId = parseInt(selEl.value) || 0;
    const item = activeArmorTable[itemId] || activeArmorTable[0];
    const chk = document.getElementById(`c${c}_armEquip_${a}`);
    const lbl = document.getElementById(`c${c}_armEquipLabel_${a}`);
    const statEl = document.getElementById(`c${c}_armStat_${a}`);

    // ジョブ適性の判定（制限チェックのON/OFFに関わらず純粋な仕様として判定）
    const isJobCompatible = (itemId === 0) || (item.category === 'armor' && item.jobs && item.jobs.includes(job));

    if (itemId === 0) {
      statEl.textContent = "-";
      statEl.className = "equip-stat";
    } else {
      const typeStr = ARMOR_TYPE_NAMES[item.type] ? `${ARMOR_TYPE_NAMES[item.type]} ` : "";
      const evaModStr = item.wt === 0 ? "±0" : `-${item.wt}`;
      statEl.textContent = `${typeStr}防 ${item.def} / 回 ${evaModStr}`;
      if (!isJobCompatible) {
        statEl.textContent += " 🆖";
        statEl.className = "equip-stat incompatible";
      } else {
        statEl.className = "equip-stat";
      }
    }

    if (isRestricted) {
      if (!isJobCompatible) {
        chk.checked = false;
        chk.disabled = true;
        lbl.classList.add('disabled');
      } else {
        chk.disabled = (itemId === 0);
        if (chk.disabled) lbl.classList.add('disabled');
        else lbl.classList.remove('disabled');

        if (chk.checked) {
          if (!equippedArmorTypes.has(item.type)) {
            equippedArmorTypes.add(item.type);
          } else {
            chk.checked = false;
          }
        }
      }
    } else {
      // 制限OFF時: 🆖であっても強制装備を許可
      chk.disabled = (itemId === 0);
      if (itemId === 0) chk.checked = false;
      if (chk.disabled) lbl.classList.add('disabled');
      else lbl.classList.remove('disabled');
    }
  }
}

    // 他の武器装備を解除（排他制御）

function onArmorEquipToggle(c, a) {
  const isRestricted = document.getElementById('restrictEquipCheckbox').checked;

    const curId = parseInt(document.getElementById(`c${c}_arm_${a}`).value) || 0;

/**
 * レベル変更時のステータス・EXP・HP・MPシミュレーション
 */
function simulateLevelStats(c) {
  if (!document.getElementById('autoCalcCheckbox').checked) return;

  const job = parseInt(document.getElementById(`c${c}_job`).value) || 0;
  let targetLv = parseInt(document.getElementById(`c${c}_lv`).value);
  if (isNaN(targetLv)) targetLv = 1;
  targetLv = Math.max(1, Math.min(50, targetLv));
  document.getElementById(`c${c}_lv`).value = targetLv;

  const expTable = GameDataManager.activeExpTable;
  const minExp = expTable[targetLv - 1] || 0;
  const maxExp = targetLv < 50 ? (expTable[targetLv] || 999999) - 1 : 999999;
  let curExp = parseInt(document.getElementById(`c${c}_exp`).value);
  if (isNaN(curExp) || curExp < minExp || curExp > maxExp) {
    document.getElementById(`c${c}_exp`).value = minExp;
  }

  const baseJob = job % 6;
  const initial = GameDataManager.activeInitialStats[baseJob];
  let hp = initial[0];
  let str = initial[1];
  let agi = initial[2];
  let int_ = initial[3];
  let vit = initial[4];
  let luk = initial[5];

  let mp = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  if (baseJob === 3 || baseJob === 4 || baseJob === 5) {
    mp[1] = 1;
  }

  const table = GameDataManager.activeGrowth[baseJob];
  for (let lv = 2; lv <= targetLv; lv++) {
    const entry = table[lv - 2];
    const statByte = entry[0];
    const mpByte = entry[1];

    let hpGain = Math.floor(vit / 4) + 1;
    if ((statByte & 0x20) !== 0) {
      hpGain += Math.floor(Math.random() * 6) + 20;
    }
    hp = Math.min(999, hp + hpGain);

    if ((statByte & 0x10) !== 0 || Math.random() < 0.25) str = Math.min(99, str + 1);
    if ((statByte & 0x08) !== 0 || Math.random() < 0.25) agi = Math.min(99, agi + 1);
    if ((statByte & 0x04) !== 0 || Math.random() < 0.25) int_ = Math.min(99, int_ + 1);
    if ((statByte & 0x02) !== 0 || Math.random() < 0.25) vit = Math.min(99, vit + 1);
    if ((statByte & 0x01) !== 0 || Math.random() < 0.25) luk = Math.min(99, luk + 1);

    if (job === 0 || job === 1 || job === 2 || job === 8) {
      // なし
    } else if (job === 6) {
      for (let s = 1; s <= 3; s++) {
        if ((mpByte & (1 << (s - 1))) !== 0) mp[s] = Math.min(4, mp[s] + 1);
      }
    } else if (job === 7) {
      for (let s = 1; s <= 4; s++) {
        if ((mpByte & (1 << (s - 1))) !== 0) mp[s] = Math.min(4, mp[s] + 1);
      }
    } else {
      for (let s = 1; s <= 8; s++) {
        if ((mpByte & (1 << (s - 1))) !== 0) mp[s] = Math.min(9, mp[s] + 1);
      }
    }
  }

  document.getElementById(`c${c}_curHp`).value = hp;
  document.getElementById(`c${c}_maxHp`).value = hp;
  document.getElementById(`c${c}_str`).value = str;
  document.getElementById(`c${c}_agi`).value = agi;
  document.getElementById(`c${c}_int`).value = int_;
  document.getElementById(`c${c}_vit`).value = vit;
  document.getElementById(`c${c}_luk`).value = luk;

  for (let s = 1; s <= 8; s++) {
    document.getElementById(`c${c}_curMp_${s}`).value = mp[s];
    document.getElementById(`c${c}_maxMp_${s}`).value = mp[s];
  }

  recalculateParameters(c);
}

/**
 * 戦闘パラメータ自動計算ロジック
 */
function recalculateParameters(c) {
  if (!document.getElementById('autoCalcCheckbox').checked) return;

  const job = parseInt(document.getElementById(`c${c}_job`).value) || 0;
  const lv = parseInt(document.getElementById(`c${c}_lv`).value) || 1;
  const str = parseInt(document.getElementById(`c${c}_str`).value) || 0;
  const agi = parseInt(document.getElementById(`c${c}_agi`).value) || 0;

  let equippedWep = null;
  for (let w = 0; w < 4; w++) {
    if (document.getElementById(`c${c}_wepEquip_${w}`).checked) {
      const wepId = parseInt(document.getElementById(`c${c}_wep_${w}`).value) || 0;
      if (wepId > 0) equippedWep = activeWeaponTable[wepId] || null;
      break;
    }
  }

  let atk = 0;
  let hitBonus = 0;

  const isMonk = (job === 2 || job === 8);
  if (isMonk && (!equippedWep || equippedWep.id === 0)) {
    atk = lv * 2;
  } else {
    atk = Math.floor(str / 2) + (equippedWep ? equippedWep.atk : 0);
    hitBonus = equippedWep ? equippedWep.hit : 0;
  }

  let baseHit = 5 + (lv * 2);
  if (job === 0 || job === 6) baseHit = 32 + (lv * 3);
  const totalHit = baseHit + hitBonus;

  let totalDef = 0;
  let totalWt = 0;
  let hasArmor = false;

  for (let a = 0; a < 4; a++) {
    if (document.getElementById(`c${c}_armEquip_${a}`).checked) {
      const armId = parseInt(document.getElementById(`c${c}_arm_${a}`).value) || 0;
      if (armId > 0) {
        const armItem = activeArmorTable[armId] || null;
        if (armItem) {
          totalDef += armItem.def;
          totalWt += armItem.wt;
          hasArmor = true;
        }
      }
    }
  }

  if (isMonk && !hasArmor) {
    totalDef = lv;
  }

  const totalEva = Math.max(0, agi + 48 - totalWt);

  document.getElementById(`c${c}_atk`).value = atk;
  document.getElementById(`c${c}_hit`).value = totalHit;
  document.getElementById(`c${c}_def`).value = totalDef;
  document.getElementById(`c${c}_eva`).value = totalEva;
}

function onStatChange(c) { recalculateParameters(c); }
function onLevelChange(c) {
  if (document.getElementById('autoCalcCheckbox').checked) {
    simulateLevelStats(c);
  } else {
    recalculateParameters(c);
  }
}

/**
 * ドラッグ＆ドロップおよびファイル読み込み
 */
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.classList.add('dragover');
});
window.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.classList.remove('dragover');
});
window.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    handleLoadedFile(e.dataTransfer.files[0]);
  }
});

document.getElementById('savInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleLoadedFile(e.target.files[0]);
});
document.getElementById('nesInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleLoadedFile(e.target.files[0]);
});

function handleLoadedFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();

  if (ext === 'nes') {
    reader.onload = (evt) => {
      const buf = new Uint8Array(evt.target.result);
      if (buf[0] === 0x4E && buf[1] === 0x45 && buf[2] === 0x53 && buf[3] === 0x1A) {
        nesRom = buf;
        GameDataManager.extractFromROM(nesRom);
        
        const romStatusEl = document.getElementById('romStatus');
        if (GameDataManager.romData.diffDetected) {
          const diffStr = GameDataManager.romData.diffList.join(", ");
          romStatusEl.innerHTML = `【ROM】${file.name} 読込完了 <span class="tag-diff">改変検知: ${diffStr}</span> [ROM準拠適用中]`;
        } else {
          romStatusEl.innerText = `【ROM】${file.name} 読込完了 (標準仕様と一致)`;
        }

        for (let c = 0; c < 4; c++) renderCharSprite(c);
      } else {
        alert("有効なNES ROMではありません。");
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = (evt) => {
      const buf = new Uint8Array(evt.target.result);
      loadedSavFileName = file.name;

      if (ext === 'dsk' || buf.length >= 360 * 1024) {
        // MSX版 ユーザーディスク (720KB / 360KB)
        savData = buf;
        setPlatform('msx');
        loadSavToUI();
        document.getElementById('fileStatus').innerText = `【DSK】MSX版 ユーザーディスク: ${file.name} (${buf.length} bytes)`;
        document.getElementById('exportBtn').disabled = false;
      } else if (buf.length >= 8192) {
        // FC版 セーブデータ (8KB)
        savData = buf;
        setPlatform('fc');
        loadSavToUI();
        document.getElementById('fileStatus').innerText = `【SAV】FC版 セーブデータ: ${file.name} (${savData.length} bytes)`;
        document.getElementById('exportBtn').disabled = false;
      } else {
        alert("有効なセーブデータ (.sav 8KB以上) または ユーザーディスク (.dsk) ではありません。");
      }
    };
    reader.readAsArrayBuffer(file);
  }
}

/**
 * SAVデータのUI展開
 */
function loadSavToUI() {
  if (!savData) return;
  const layout = SAVE_LAYOUTS[activePlatform];

  // 所持金
  document.getElementById('goldInput').value = readVal(savData, layout.goldAddr, layout.goldBytes, layout.goldEndian);
  // 乗り物・イベントフラグ
  document.getElementById('shipFlag').checked = (savData[layout.shipAddr] === 0x01);
  document.getElementById('nitroFlag').checked = (savData[layout.nitroAddr] === 0x01);
  document.getElementById('airshipFlag').checked = (savData[layout.airshipAddr] === layout.airshipVal);
  document.getElementById('bridgeFlag').checked = (savData[layout.bridgeAddr] === 0x01);
  document.getElementById('introSceneFlag').checked = (savData[layout.introSceneAddr] === 0x01);

  // 消費アイテム
  CONSUMABLES.forEach((c, idx) => {
    document.getElementById(`con_${c.id}`).value = savData[layout.consumableAddr + idx];
  });
  // 重要アイテム (0でなければ所持)
  KEY_ITEMS.forEach((k, idx) => {
    document.getElementById(`key_${k.id}`).checked = (savData[layout.keyItemAddr + idx] !== 0x00);
  });

  // キャラクタデータ
  for (let c = 0; c < 4; c++) {
    const base = layout.charBase + (c * layout.charStride);
    const mBase = layout.magicBase + (c * layout.magicStride);

    const job = savData[base + 0x00]; // 0x00: ジョブ (0〜11)
    document.getElementById(`c${c}_job`).value = job;
    document.getElementById(`c${c}_status`).value = savData[base + 0x01]; // 0x01: 状態

    // 0x02〜0x05: 名前 (4文字、FF1独自文字コード)
    let nameStr = "";
    for (let n = 0; n < 4; n++) {
      nameStr += (CHAR_MAP[savData[base + 0x02 + n]] || " ");
    }
    document.getElementById(`c${c}_name`).value = nameStr.trim();

    // 0x07〜0x09: 経験値 (エンディアン指定読み込み)
    document.getElementById(`c${c}_exp`).value = readVal(savData, base + 0x07, 3, layout.expEndian);
    // 0x0A〜0x0D: 現在HP / 最大HP (各2バイト リトルエンディアン)
    document.getElementById(`c${c}_curHp`).value = readVal(savData, base + 0x0A, 2, 'LE');
    document.getElementById(`c${c}_maxHp`).value = readVal(savData, base + 0x0C, 2, 'LE');

    // 0x10〜0x14: 基本能力値 (力, 早, 知, 体, 運)
    document.getElementById(`c${c}_str`).value = savData[base + 0x10];
    document.getElementById(`c${c}_agi`).value = savData[base + 0x11];
    document.getElementById(`c${c}_int`).value = savData[base + 0x12];
    document.getElementById(`c${c}_vit`).value = savData[base + 0x13];
    document.getElementById(`c${c}_luk`).value = savData[base + 0x14];

    // 0x20〜0x23: 戦闘パラメータ (ウェポン, めいちゅうりつ, アーマー, かいひりつ)
    document.getElementById(`c${c}_atk`).value = savData[base + 0x20];
    document.getElementById(`c${c}_hit`).value = savData[base + 0x21];
    document.getElementById(`c${c}_def`).value = savData[base + 0x22];
    document.getElementById(`c${c}_eva`).value = savData[base + 0x23];

    // レベル (FC版: 内部値0=Lv1, MSX版: 内部値そのまま)
    const rawLv = savData[base + layout.lvOffset];
    document.getElementById(`c${c}_lv`).value = layout.lvZeroBased ? (rawLv + 1) : rawLv;

    // 0x18〜0x1B: 武器スロット4つ (機種ネイティブコード直結)
    for (let w = 0; w < 4; w++) {
      const raw = savData[base + 0x18 + w];
      document.getElementById(`c${c}_wep_${w}`).value = (raw & 0x7F);
      document.getElementById(`c${c}_wepEquip_${w}`).checked = ((raw & 0x80) !== 0);
    }

    // 0x1C〜0x1F: 防具スロット4つ (機種ネイティブコード直結)
    for (let a = 0; a < 4; a++) {
      const raw = savData[base + 0x1C + a];
      document.getElementById(`c${c}_arm_${a}`).value = (raw & 0x7F);
      document.getElementById(`c${c}_armEquip_${a}`).checked = ((raw & 0x80) !== 0);
    }

    // 魔法スロット (Lv1〜8 各3つ) & MP (現在MP: mBase+0x20〜0x27, 最大MP: mBase+0x28〜0x2F)
    for (let lv = 1; lv <= 8; lv++) {
      const spOffset = mBase + ((lv - 1) * 4);
      for (let s = 0; s < 3; s++) {
        let spVal = savData[spOffset + s];
        if (activePlatform === 'msx' && spVal >= 0xB0 && spVal <= 0xEF) {
          spVal = ((spVal - 0xB0) % 8) + 1;
        }
        document.getElementById(`c${c}_spell_${lv}_${s}`).value = spVal;
      }
      document.getElementById(`c${c}_curMp_${lv}`).value = savData[mBase + layout.curMpOffset + (lv - 1)];
      document.getElementById(`c${c}_maxMp_${lv}`).value = savData[mBase + layout.maxMpOffset + (lv - 1)];
    }

    renderCharSprite(c);
    updateAllEquipStatsAndRestrictions(c);
  }
}

function applyUIToSav() {
  if (!savData) return;
  const layout = SAVE_LAYOUTS[activePlatform];

  // 所持金 (指定エンディアン・バイト数で書き込み)
  let gold = parseInt(document.getElementById('goldInput').value) || 0;
  gold = Math.min(getLimit('gold'), Math.max(0, gold));
  writeVal(savData, layout.goldAddr, layout.goldBytes, gold, layout.goldEndian);

  // 乗り物・イベントフラグ
  savData[layout.shipAddr] = document.getElementById('shipFlag').checked ? 0x01 : 0x00;
  savData[layout.nitroAddr] = document.getElementById('nitroFlag').checked ? 0x01 : 0x00;
  savData[layout.airshipAddr] = document.getElementById('airshipFlag').checked ? layout.airshipVal : 0x00;
  savData[layout.bridgeAddr] = document.getElementById('bridgeFlag').checked ? 0x01 : 0x00;
  savData[layout.introSceneAddr] = document.getElementById('introSceneFlag').checked ? 0x01 : 0x00;

  // 消費アイテム
  CONSUMABLES.forEach((c, idx) => {
    const val = parseInt(document.getElementById(`con_${c.id}`).value) || 0;
    savData[layout.consumableAddr + idx] = Math.min(getLimit('item'), Math.max(0, val));
  });

  // 重要アイテム (FC版は0x01, MSX版は0xFF)
  KEY_ITEMS.forEach((k, idx) => {
    savData[layout.keyItemAddr + idx] = document.getElementById(`key_${k.id}`).checked ? layout.keyItemVal : 0x00;
  });

  // 各キャラクタデータ書き込み
  for (let c = 0; c < 4; c++) {
    const base = layout.charBase + (c * layout.charStride);
    const mBase = layout.magicBase + (c * layout.magicStride);

    savData[base + 0x00] = parseInt(document.getElementById(`c${c}_job`).value);
    savData[base + 0x01] = parseInt(document.getElementById(`c${c}_status`).value);

    // 名前 (4文字、未入力部分は空白 0xFF)
    const nameStr = document.getElementById(`c${c}_name`).value || "";
    for (let n = 0; n < 4; n++) {
      const char = nameStr[n];
      savData[base + 0x02 + n] = (char && REVERSE_CHAR_MAP[char] !== undefined) ? REVERSE_CHAR_MAP[char] : 0xFF;
    }

    // 経験値 (指定エンディアンで書き込み)
    const exp = Math.min(getLimit('exp'), Math.max(0, parseInt(document.getElementById(`c${c}_exp`).value) || 0));
    writeVal(savData, base + 0x07, 3, exp, layout.expEndian);

    // 現在HP / 最大HP (各2バイト リトルエンディアン)
    const curHp = Math.min(getLimit('hp'), Math.max(0, parseInt(document.getElementById(`c${c}_curHp`).value) || 0));
    const maxHp = Math.min(getLimit('hp'), Math.max(1, parseInt(document.getElementById(`c${c}_maxHp`).value) || 1));
    writeVal(savData, base + 0x0A, 2, curHp, 'LE');
    writeVal(savData, base + 0x0C, 2, maxHp, 'LE');

    // 基本能力値 (力, 早, 知, 体, 運)
    savData[base + 0x10] = Math.max(1, Math.min(getLimit('stat'), parseInt(document.getElementById(`c${c}_str`).value) || 1));
    savData[base + 0x11] = Math.max(1, Math.min(getLimit('stat'), parseInt(document.getElementById(`c${c}_agi`).value) || 1));
    savData[base + 0x12] = Math.max(1, Math.min(getLimit('stat'), parseInt(document.getElementById(`c${c}_int`).value) || 1));
    savData[base + 0x13] = Math.max(1, Math.min(getLimit('stat'), parseInt(document.getElementById(`c${c}_vit`).value) || 1));
    savData[base + 0x14] = Math.max(1, Math.min(getLimit('stat'), parseInt(document.getElementById(`c${c}_luk`).value) || 1));

    // 戦闘パラメータ (ウェポン, めいちゅうりつ, アーマー, かいひりつ)
    savData[base + 0x20] = Math.max(0, Math.min(getLimit('combat'), parseInt(document.getElementById(`c${c}_atk`).value) || 0));
    savData[base + 0x21] = Math.max(0, Math.min(getLimit('combat'), parseInt(document.getElementById(`c${c}_hit`).value) || 0));
    savData[base + 0x22] = Math.max(0, Math.min(getLimit('combat'), parseInt(document.getElementById(`c${c}_def`).value) || 0));
    savData[base + 0x23] = Math.max(0, Math.min(getLimit('combat'), parseInt(document.getElementById(`c${c}_eva`).value) || 0));

    // レベル (FC版: 内部値0=Lv1, MSX版: 内部値そのまま)
    const lv = parseInt(document.getElementById(`c${c}_lv`).value) || 1;
    const lvRaw = layout.lvZeroBased
      ? Math.max(0, Math.min(getLimit('lv') - 1, lv - 1))
      : Math.max(1, Math.min(getLimit('lv'), lv));
    savData[base + layout.lvOffset] = lvRaw;

    // 武器 (機種ネイティブコードをそのままスロットに書き込み)
    for (let w = 0; w < 4; w++) {
      let id = parseInt(document.getElementById(`c${c}_wep_${w}`).value) || 0;
      if (id > 0 && document.getElementById(`c${c}_wepEquip_${w}`).checked) id |= 0x80;
      savData[base + 0x18 + w] = id;
    }

    // 防具 (機種ネイティブコードをそのままスロットに書き込み)
    for (let a = 0; a < 4; a++) {
      let id = parseInt(document.getElementById(`c${c}_arm_${a}`).value) || 0;
      if (id > 0 && document.getElementById(`c${c}_armEquip_${a}`).checked) id |= 0x80;
      savData[base + 0x1C + a] = id;
    }

    // 習得魔法 & MP
    for (let lv = 1; lv <= 8; lv++) {
      const spOffset = mBase + ((lv - 1) * 4);
      for (let s = 0; s < 3; s++) {
        let spVal = parseInt(document.getElementById(`c${c}_spell_${lv}_${s}`).value) || 0;
        if (activePlatform === 'msx' && spVal >= 1 && spVal <= 8) {
          spVal = 0xB0 + ((lv - 1) * 8) + (spVal - 1);
        }
        savData[spOffset + s] = spVal;
      }
      savData[mBase + layout.curMpOffset + (lv - 1)] = Math.min(9, Math.max(0, parseInt(document.getElementById(`c${c}_curMp_${lv}`).value) || 0));
      savData[mBase + layout.maxMpOffset + (lv - 1)] = Math.min(9, Math.max(0, parseInt(document.getElementById(`c${c}_maxMp_${lv}`).value) || 0));
    }
  }
}

document.getElementById('exportBtn').addEventListener('click', () => {
  applyUIToSav();
  const defaultName = (activePlatform === 'msx') ? "FINAL_FANTASY_1_USER_DISK.dsk" : "FINAL_FANTASY_1.sav";
  const blob = new Blob([savData], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = loadedSavFileName || defaultName;
  a.click();
  URL.revokeObjectURL(a.href);
});

function decode2bppTile(rom, offset, imgData, dx, dy, paletteRGB) {
  for (let y = 0; y < 8; y++) {
    const p0 = rom[offset + y];
    const p1 = rom[offset + y + 8];
    for (let x = 0; x < 8; x++) {
      const bit = 7 - x;
      const colorIdx = ((p0 >> bit) & 1) | (((p1 >> bit) & 1) << 1);
      const rgb = paletteRGB[colorIdx];
      const pIdx = ((dy + y) * 16 + (dx + x)) * 4;
      imgData.data[pIdx + 0] = rgb[0];
      imgData.data[pIdx + 1] = rgb[1];
      imgData.data[pIdx + 2] = rgb[2];
      imgData.data[pIdx + 3] = (colorIdx === 0) ? 0 : 255;
    }
  }
}

function renderCharSprite(c) {
  const canvas = document.getElementById(`charCanvas_${c}`);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 16, 24);

  const job = parseInt(document.getElementById(`c${c}_job`).value) || 0;

  if (!nesRom) return;

  const baseOffset = GameDataManager.getBankOffset(nesRom, 9) + 0x1000 + (job * 0x200);
  const imgData = ctx.createImageData(16, 24);

  const assign = GameDataManager.activeJobPaletteAssignment;
  const palId = assign[job] !== undefined ? assign[job] : 0;
  const palettes = GameDataManager.activePalettes;
  const palIndices = palettes[palId] || palettes[0];
  const paletteRGB = palIndices.map(idx => NES_PALETTE[idx & 0x3F]);

  if (baseOffset + 96 <= nesRom.length) {
    decode2bppTile(nesRom, baseOffset + 0,  imgData, 0, 0, paletteRGB);
    decode2bppTile(nesRom, baseOffset + 16, imgData, 8, 0, paletteRGB);
    decode2bppTile(nesRom, baseOffset + 32, imgData, 0, 8, paletteRGB);
    decode2bppTile(nesRom, baseOffset + 48, imgData, 8, 8, paletteRGB);
    decode2bppTile(nesRom, baseOffset + 64, imgData, 0, 16, paletteRGB);
    decode2bppTile(nesRom, baseOffset + 80, imgData, 8, 16, paletteRGB);
  }

  ctx.putImageData(imgData, 0, 0);
}

window.onload = initUI;
